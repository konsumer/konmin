# Release build workflow
#
# versionCode/versionName are stamped automatically from the release git tag
# (vMAJOR.MINOR.PATCH). See the "Compute version from tag" step.
#
# Runs when a GitHub Release is published: the APK is built from the release
# tag and auto-attached to that release.
#
# It can also be run manually (workflow_dispatch) with the "tag" input set to
# an already-published release tag: the workflow checks out that tag, builds
# the released source, and attaches the APK to that existing release. A manual
# run without the tag input fails fast with instructions.
#
# Note: the workflow file must live on the default branch for the release
# trigger (release: types: [published]) to fire.
#
# Release signing:
# The released APK carries a STABLE signature across releases so users can
# upgrade in place. That signature comes from a release keystore supplied as a
# GitHub Actions secret.
#
# Secrets consumed (set in the repo's Actions secrets):
#   KEYSTORE_BASE64   - base64-encoded release keystore file
#   KEYSTORE_PASSWORD - keystore password
#   KEY_ALIAS         - key alias inside the keystore
#   KEY_PASSWORD      - key password for that alias
#
# If KEYSTORE_BASE64 is present, the keystore is decoded into $RUNNER_TEMP and
# the gradle build signs a release APK (assembleRelease), which is uploaded.
# If the secret is absent (or blank), the build falls back to a debug-signed
# APK (assembleDebug), which is uploaded instead. No keystore material is ever
# committed to the repository.

name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK to (manual rebuild)
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: "Guard: manual run requires a tag input"
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          echo "Manual (workflow_dispatch) run started without a tag input."
          echo "Supply the 'tag' input naming an already-published release tag"
          echo "(e.g. v0.1.0) so the workflow can attach the rebuilt APK to it."
          exit 1

      # versionCode/versionName come from the release tag automatically
      # (vMAJOR.MINOR.PATCH). versionCode = major*1000000 + minor*1000 + patch,
      # exported as VERSION_CODE/VERSION_NAME for the gradle build below.
      - name: Compute version from tag
        if: github.event.release.tag_name != '' || inputs.tag != ''
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "TAG is empty; skipping version stamping."
            exit 0
          fi
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Tag '$TAG' does not parse as vMAJOR.MINOR.PATCH."
            echo "Please tag releases as vMAJOR.MINOR.PATCH (e.g. v0.2.0)."
            exit 1
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          VERSION_NAME="$VERSION"
          echo "Computed versionCode=$VERSION_CODE versionName=$VERSION_NAME from tag $TAG"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release (or debug) APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "Release keystore decoded — APK will be release-signed."
            ./gradlew assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/konmin-${VERSION_NAME}-release.apk" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret — building debug-signed APK."
            ./gradlew assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/konmin-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: ${{ env.APK_PATH }}